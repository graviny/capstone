#VRML_SIM R2025a utf8
# Differential-drive robot for the warehouse scenario.
# Uses only base nodes so the world opens without downloading remote PROTOs.

PROTO SimpleBot [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "robot"
  field SFString   controller      "agent"
  field MFString   controllerArgs  []
  field SFColor    color           0.2 0.4 0.9
  field SFInt32    receiverChannel 100
  field SFRotation cameraRotation  0 0 1 1.5708
  field SFFloat    cameraFov       1.08          # Pi camera (OV5647) horizontal FOV, 62 deg
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    contactMaterial "slippery"
    children [
      Pose {
        translation 0 0 0.06
        children [
          Shape {
            appearance PBRAppearance { baseColor IS color roughness 0.6 metalness 0 }
            geometry Cylinder { radius 0.1 height 0.06 }
          }
        ]
      }
      Pose {
        translation 0 0 0.16
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.2 0.2 0.2 metalness 0 }
            geometry Cylinder { radius 0.015 height 0.14 }
          }
        ]
      }
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 0.09 0.033 }
        device [ RotationalMotor { name "left wheel motor" maxVelocity 15 } ]
        endPoint Solid {
          translation 0 0.09 0.033
          rotation 1 0 0 1.5708
          name "left wheel"
          children [
            DEF WHEEL Shape {
              appearance PBRAppearance { baseColor 0.1 0.1 0.1 metalness 0 }
              geometry Cylinder { radius 0.033 height 0.02 }
            }
          ]
          boundingObject USE WHEEL
          physics Physics { density -1 mass 0.05 }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 -0.09 0.033 }
        device [ RotationalMotor { name "right wheel motor" maxVelocity 15 } ]
        endPoint Solid {
          translation 0 -0.09 0.033
          rotation 1 0 0 1.5708
          name "right wheel"
          children [ USE WHEEL ]
          boundingObject USE WHEEL
          physics Physics { density -1 mass 0.05 }
        }
      }
      GPS { name "gps" }
      InertialUnit { name "imu" }
      Camera {
        name "camera"
        translation 0 0 0.24
        rotation IS cameraRotation
        width 160
        height 120
        fieldOfView IS cameraFov
        recognition Recognition { maxRange 4 }
      }
      Emitter { name "emitter" channel 0 range -1 }
      Receiver { name "receiver" channel IS receiverChannel }
    ]
    boundingObject Group {
      children [
        Pose { translation 0 0 0.06 children [ Cylinder { radius 0.1 height 0.06 } ] }
        Pose { translation 0.07 0 0.015 children [ Sphere { radius 0.015 } ] }
        Pose { translation -0.07 0 0.015 children [ Sphere { radius 0.015 } ] }
      ]
    }
    physics Physics { density -1 mass 1 }
  }
}
